metadata:
  title: Mobile Application Security Weakness Enumeration (MASWE)
  remarks: The OWASP MASWE (Mobile Application Security Weakness Enumeration) is a list of common security and privacy weaknesses in mobile applications. It acts as the bridge between the OWASP MASVS and the OWASP MASTG.
  version: v1.0.0
weaknesses:
  MASWE-0001:
    title: Sensitive Data Stored Unencrypted in Private Storage
    id: MASWE-0001
    alias: data-unencrypted-private-storage
    requirement: The app encrypts sensitive data stored in private storage.
    platform:
    - android
    - ios
    profiles:
    - L2
    threat: MAS-THREAT-0001
    attacks:
    - MAS-ATTACK-0005
    - MAS-ATTACK-0007
    - MAS-ATTACK-0008
    mappings:
      masvs-v1:
      - MSTG-STORAGE-2
      masvs-v2:
      - MASVS-STORAGE-1
      - MASVS-STORAGE-2
      - MASVS-CRYPTO-2
      cwe:
      - 200
      - 284
      - 312
      - 313
      - 732
      - 922
      android-risks:
      - file-providers
      maswe-beta:
      - MASWE-0006
      - MASWE-0002
      - MASWE-0118
    refs:
    - https://developer.apple.com/documentation/uikit/protecting_the_user_s_privacy/encrypting_your_app_s_files
    - https://developer.android.com/about/versions/nougat/android-7.0-changes#permfilesys
    - https://developer.android.com/privacy-and-security/security-tips#internal-storage
