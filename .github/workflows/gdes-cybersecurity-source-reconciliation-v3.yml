name: GDES Cybersecurity Source Reconciliation v3

on:
  push:
    branches:
      - gdes/ai-governance-v1-pilot
    paths:
      - scripts/gdes/extract_cybersecurity_framework_metadata.py
      - .github/workflows/gdes-cybersecurity-source-reconciliation-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdes-cybersecurity-source-reconciliation-v3
  cancel-in-progress: false

jobs:
  extract:
    name: Extract pinned framework metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Extract metadata and generate catalogs
        run: python scripts/gdes/extract_cybersecurity_framework_metadata.py

      - name: Commit generated catalogs to pilot branch only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registers/data/
          if git diff --cached --quiet; then
            echo "No generated catalog changes."
            exit 0
          fi
          git commit -m "docs(gdes): generate pinned cybersecurity source catalogs"
          git push origin "HEAD:${TARGET_BRANCH}"
