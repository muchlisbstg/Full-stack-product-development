name: GDES Office AI Harness

on:
  pull_request:
    paths:
      - "evaluation-labs/office-ai/**"
      - ".github/workflows/gdes-office-ai-harness.yml"
  push:
    branches:
      - "gdes/office-ai-evaluation-harness"
    paths:
      - "evaluation-labs/office-ai/**"
      - ".github/workflows/gdes-office-ai-harness.yml"

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline harness tests
        working-directory: evaluation-labs/office-ai
        run: python -m unittest discover -s tests -v
      - name: Generate common synthetic fixtures
        working-directory: evaluation-labs/office-ai
        run: python tools/office_ai_harness.py prepare --output-dir "$RUNNER_TEMP/office-ai-fixtures"
      - name: Upload common fixture bundle
        uses: actions/upload-artifact@v4
        with:
          name: gdes-office-ai-common-fixtures
          path: ${{ runner.temp }}/office-ai-fixtures/
          if-no-files-found: error
          retention-days: 30
