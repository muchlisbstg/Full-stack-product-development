name: GDES Replica Skill Isolated Evaluation

on:
  push:
    branches:
      - gdes/replica-skill-evaluation
    paths:
      - .github/workflows/gdes-replica-skill-isolated-eval.yml
      - scripts/gdes/validate_replica_skill_metadata.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdes-replica-skill-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-evaluation:
    name: Pinned source and standard-library tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GDES evidence branch without persisted credentials
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git clone --quiet "https://github.com/${REPOSITORY}.git" "$RUNNER_TEMP/gdes"
          git -C "$RUNNER_TEMP/gdes" fetch --quiet --depth=1 origin "${COMMIT_SHA}"
          git -C "$RUNNER_TEMP/gdes" checkout --quiet --detach FETCH_HEAD

      - name: Fetch exact upstream Replica Skill source pin
        env:
          UPSTREAM_SHA: 77c9436fb3d18c3d58169efb8caf4fe906b0dc51
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/Jakeschincariol/replica-skill.git "$RUNNER_TEMP/replica-skill"
          git -C "$RUNNER_TEMP/replica-skill" fetch --quiet --depth=1 origin "${UPSTREAM_SHA}"
          git -C "$RUNNER_TEMP/replica-skill" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/replica-skill" rev-parse HEAD)" = "${UPSTREAM_SHA}"
          echo "Verified upstream SHA: ${UPSTREAM_SHA}"

      - name: Validate all 11 skill metadata and expected utilities
        run: |
          python3 "$RUNNER_TEMP/gdes/scripts/gdes/validate_replica_skill_metadata.py" "$RUNNER_TEMP/replica-skill"

      - name: Run upstream standard-library unit tests
        working-directory: ${{ runner.temp }}/replica-skill
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
